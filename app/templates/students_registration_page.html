{% extends "base.html" %}

{% block title %}Student Registration{% endblock %}

{% block style %}
<style>
    body {
        background-color: #d6d6d6d4 ;
    }

    .form-card {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.06);
        transition: all 0.3s ease-in-out;
    }

    .form-card:hover {
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.08);
    }

    .form-label i {
        margin-right: 6px;
        color: #0d6efd;
    }

    h4 {
        font-weight: 700;
    }

    .btn-success {
        padding: 10px;
        font-size: 1.1rem;
    }

    textarea:focus, input:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.2);
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="form-card">
                <h4 class="text-center text-primary mb-4">📋 Student Registration</h4>
                <form id="saveForm" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-image"></i>Student Photo</label>
                        <input type="file" name="studentPhoto" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person"></i>Student Name</label>
                        <input type="text" name="studentName" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person-badge"></i>Student ID</label>
                        <input type="text" name="studentId" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person"></i>Father's Name</label>
                        <input type="text" name="fatherName" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person"></i>Mother's Name</label>
                        <input type="text" name="motherName" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-calendar"></i>Age</label>
                        <input type="number" name="studentAge" class="form-control" min="1" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-geo-alt"></i>Place</label>
                        <input type="text" name="studentPlace" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-telephone"></i>Father's Phone</label>
                        <input type="text" name="fatherPhone" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-telephone"></i>Mother's Phone</label>
                        <input type="text" name="motherPhone" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-house-door"></i>Address</label>
                        <textarea name="studentAddress" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success fw-bold" onclick="saveStudentDatas()">✅ Save Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script>
    function saveStudentDatas() {
        event.preventDefault();
        const form = document.getElementById('saveForm');
        const formData = new FormData(form);

        fetch(`/register`, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("❌ Error saving student");
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                alert("✅ Student registered successfully!");
                location.reload();
            }
        })
        .catch(error => {
            alert("❌ Failed to save student.");
            console.error(error);
        });
    }
</script>
{% endblock %}
