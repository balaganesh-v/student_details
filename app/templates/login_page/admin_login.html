<!-- templates/admin_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login - SchoolSync</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #e0ecff, #f8f9fa);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-form {
      max-width: 450px;
      margin: auto;
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.8s ease-in-out;
    }

    .login-form h3 {
      font-weight: 600;
      margin-bottom: 20px;
      color: #0d6efd;
    }

    .login-form label {
      font-weight: 500;
      margin-bottom: 5px;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #0d6efd;
    }

    .btn-primary {
      background-color: #0d6efd;
      border: none;
    }

    .btn-primary:hover {
      background-color: #084298;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-header {
      text-align: center;
    }

    .form-header img {
      width: 60px;
      margin-bottom: 10px;
    }

    .form-header p {
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="login-form">
      <div class="form-header">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Admin Icon">
        <h3>Admin Login</h3>
        <p>Enter your credentials to access the dashboard</p>
      </div>
      <form 
        method="POST" 
        action="/admin_login" 
        autocomplete="on" 
        id="adminLoginForm" 
        name="adminLoginForm"
      >
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="user_email" placeholder="admin@schoolsync.com" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="user_password" placeholder="********" required />
        </div>
        <div class="mb-4">
          <label for="otp" class="form-label">Authenticator Code</label>
          <input type="text" class="form-control" id="otp" name="user_otp" placeholder="6-digit code" maxlength="6" />
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
