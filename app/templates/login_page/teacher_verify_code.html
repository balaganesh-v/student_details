<!-- templates/login_page/teacher_verify_code.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Code - SchoolSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background: white;
      /* Changed from gradient to white */
      font-family: 'Segoe UI', sans-serif;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-box h2 {
      margin-bottom: 30px;
      color: #002147;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #00bcd4;
    }

    .btn-success {
      background-color: #28a745;
      border: none;
    }

    .btn-success:hover {
      background-color: #218838;
    }

    .back-link {
      margin-top: 20px;
      display: block;
      text-align: center;
    }
  </style>

</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <h2 class="text-center">Enter 4-Digit Code</h2>
      <form action="/teacher_login/verify_code" method="post">
        <div class="mb-3">
          <label for="user_code" class="form-label">Enter 4-Digit Code</label>
          <input type="text" class="form-control" id="user_code" name="user_code" pattern="\d{4}" maxlength="4"
            required>
        </div>
        <button type="submit" class="btn btn-success w-100">Verify & Login</button>
      </form>
      <a href="/" class="back-link text-decoration-none">Back to Home</a>
    </div>
  </div>
</body>

</html>
