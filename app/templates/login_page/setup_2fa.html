<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Setup 2FA - SchoolSync</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #e0ecff, #f8f9fa);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .setup-form {
      max-width: 550px;
      margin: auto;
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .setup-form h3 {
      font-weight: 600;
      margin-bottom: 20px;
      color: #0d6efd;
      text-align: center;
    }

    .instructions {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
    }

    .qr-box {
      text-align: center;
    }

    .btn-primary {
      background-color: #0d6efd;
      border: none;
    }

    .btn-primary:hover {
      background-color: #084298;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="setup-form">
      <h3>Set Up Google Authenticator</h3>
      <p class="instructions">
        To enable two-factor authentication (2FA), scan the QR code below using the
        <strong>Google Authenticator</strong> app on your mobile device.<br>
        After scanning, you will get a 6-digit code in the app to log in.
      </p>

      <div class="qr-box">
        <img src="{{ qr_url }}" alt="QR Code for 2FA" class="img-fluid mb-3" style="max-width: 250px;" />
      </div>

      <div class="text-center mt-4">
        <a href="{{ url_for('admin.admin_login') }}" class="btn btn-primary">Proceed to Login</a>
      </div>
    </div>
  </div>
</body>
</html>
